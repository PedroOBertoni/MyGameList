name: my_game_list
description: Biblioteca pessoal de jogos com armazenamento local offline-first.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  uuid: ^4.6.0
  intl: ^0.20.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^11.0.0
  http: ^1.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.webp
  remove_alpha_ios: true
  background_color_ios: '#081321'
  adaptive_icon_background: '#081321'
  adaptive_icon_foreground: assets/images/logo.webp
  web:
    generate: true
    image_path: assets/images/logo.webp
    background_color: '#081321'
    theme_color: '#081321'

flutter:
  uses-material-design: true
  assets:
    - assets/images/img_fundo.webp
